# easyworker on macOS 15 (Sequoia) with Xcode — a lightweight sandbox worker.
#
# Same contract as k8s/easyworker-macos.yaml, but the image carries Xcode 26.3
# Universal + the Command Line Tools (Swift 6.2.4, clang 17) so build agents can
# run `xcodebuild` / `swift build` directly.
#
# Verified booting and serving with CPU_CORES=4 / RAM_SIZE=16384M (the default
# below). Raise to 8/16 for heavier builds; the baked guest disk supports it
# without re-install.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyworker-macos-xcode
  namespace: temp
  labels:
    app: easyworker-macos-xcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easyworker-macos-xcode
  template:
    metadata:
      labels:
        app: easyworker-macos-xcode
    spec:
      nodeSelector:
        kubernetes.io/hostname: <node-name>
      # Only needed if the image comes from a private registry.
      imagePullSecrets:
        - name: <registry-credentials>
      containers:
        - name: macos
          image: <registry>/vm-images/easyworker-macos:v1.5.0-xcode
          imagePullPolicy: IfNotPresent

          securityContext:
            privileged: false
            runAsUser: 0
            allowPrivilegeEscalation: true
            seccompProfile: { type: Unconfined }
            appArmorProfile: { type: Unconfined }
            capabilities:
              add: ["NET_ADMIN","NET_RAW","SYS_ADMIN","SYS_NICE","MKNOD",
                    "CHOWN","SETUID","SETGID","DAC_OVERRIDE","FOWNER","KILL"]

          ports:
            - { name: web, containerPort: 8006 }
            - { name: worker, containerPort: 48080 }

          env:
            # Non-empty => the guest worker starts pre-authorized (no claim).
            - { name: WORKER_TOKEN, value: "" }
            - { name: VERSION, value: "15" }
            # macOS wants a power-of-two vCPU count (2/4/8/16/...).
            - { name: CPU_CORES, value: "4" }
            - { name: RAM_SIZE, value: "16384M" }
            - { name: DISK_SIZE, value: "128G" }    # >= baked disk size
            - { name: MANUAL, value: "N" }

          resources:
            requests: { cpu: "4", memory: "16Gi" }
            limits:
              cpu: "4"
              memory: "20Gi"
              squat.ai/kvm: "1"        # <- the KVM device request

          volumeMounts:
            - { name: devtun, mountPath: /dev/net/tun }
      volumes:
        - name: devtun
          hostPath: { path: /dev/net/tun, type: CharDevice }
---
apiVersion: v1
kind: Service
metadata:
  name: easyworker-macos-xcode
  namespace: temp
  labels:
    app: easyworker-macos-xcode
spec:
  selector:
    app: easyworker-macos-xcode
  ports:
    - { name: http, port: 80, targetPort: 48080 }
    - { name: worker, port: 48080, targetPort: 48080 }
  type: ClusterIP
---
# SSH into the guest (read the enrollment code from /Users/docker/ewws/jobs.db).
apiVersion: v1
kind: Service
metadata:
  name: ssh-easyworker-macos-xcode
  namespace: temp
  labels:
    app: easyworker-macos-xcode
spec:
  selector:
    app: easyworker-macos-xcode
  ports:
    - { name: ssh, port: 22, targetPort: 22 }
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: easyworker-macos-xcode-novnc
  namespace: temp
  labels:
    app: easyworker-macos-xcode
spec:
  selector:
    app: easyworker-macos-xcode
  ports:
    - { name: web, port: 80, targetPort: 8006 }
  type: ClusterIP
