# easyworker Android sandbox — RUN-ONLY: the official Android Emulator, a
# system image, adb and the browser screen bridge. No build toolchain.
#
# APKs are built OUTSIDE the sandbox and pushed in over the worker API, then
# installed with adb — the worker (host side) drives the KVM-accelerated
# emulator. The emulator runs headless and its screen is relayed to a browser
# by a small bridge (scrcpy-server H.264 -> WebSocket -> MSE/jMuxer); no X
# server, no VNC.
#
#   FileWrite  app.apk                    (external x86_64 or pure-Java APK)
#   Execute    adb -s emulator-5554 install -r app.apk
#   Execute    adb -s emulator-5554 shell am start -n <pkg>/.MainActivity
#
# The screen is view-only. To drive the device, run adb through the worker API:
#   adb -s emulator-5554 shell input tap 540 1200
#   adb -s emulator-5554 shell input text hello
#
# Two flavors (see readme): v1.2.0-aosp (no GMS) and v1.2.0-gms (GMS, no Play).
#
# The guest is NOT persistent: the emulator always boots with -wipe-data, so
# every container start is a clean device (nothing survives a restart).
#
# privileged: false — KVM comes from the squat.ai/kvm device plugin, exactly
# like the Windows/macOS VM workers.
#
# Endpoints (inside the pod):
#   :48080  Worker API  (WorkerService + WorkerEnroll)
#   :6080   screen      (browser view, open — ClusterIP only)
#   :5555   emulator adbd (internal; used by adb/jobs)
#
# GPU is optional. The default is software rendering
# (ANDROID_GPU=swiftshader_indirect). To use a host GPU, uncomment the
# runtimeClassName/resources below and set ANDROID_GPU=host.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyworker-android
  namespace: temp
  labels:
    app: easyworker-android
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easyworker-android
  template:
    metadata:
      labels:
        app: easyworker-android
    spec:
      # Only needed if the image comes from a private registry.
      imagePullSecrets:
        - name: <registry-credentials>
      containers:
        - name: android
          # v1.2.0-aosp: no GMS.  Use v1.2.0-gms for Google APIs (no Play Store).
          image: <registry>/easyworker-android:v1.2.0-aosp
          imagePullPolicy: IfNotPresent

          # Optional: run on a host GPU. Requires the NVIDIA container runtime
          # and a node with an allocatable nvidia.com/gpu; then set
          # ANDROID_GPU=host below.
          # runtimeClassName: nvidia
          securityContext:
            privileged: false
            runAsUser: 0
            allowPrivilegeEscalation: true
            seccompProfile: { type: Unconfined }
            appArmorProfile: { type: Unconfined }
            capabilities:
              add: ["NET_ADMIN","NET_RAW","SYS_ADMIN","SYS_NICE","MKNOD",
                    "CHOWN","SETUID","SETGID","DAC_OVERRIDE","FOWNER","KILL"]

          ports:
            - { name: worker, containerPort: 48080 }
            - { name: screen, containerPort: 6080 }

          env:
            # Set a value to pre-authorize the worker (zero-touch, no claim);
            # leave empty for the default random-code enrollment flow.
            - { name: WORKER_TOKEN, value: "" }
            - { name: WORKER_PORT, value: "48080" }
            - { name: WORKER_WORKSPACE, value: "/workspace" }
            - { name: WORKER_DB, value: "/tmp/easyworker/jobs.db" }
            # Guest sizing.
            - { name: ANDROID_MEM, value: "4096" }
            - { name: ANDROID_CPUS, value: "4" }
            # swiftshader_indirect (default) | host (needs runtimeClassName nvidia)
            - { name: ANDROID_GPU, value: "swiftshader_indirect" }

          readinessProbe:
            httpGet: { path: /healthz, port: 48080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 48080 }
            initialDelaySeconds: 90
            periodSeconds: 20

          resources:
            requests: { cpu: "4", memory: "8Gi" }
            limits:
              cpu: "8"
              memory: "16Gi"
              squat.ai/kvm: "1"        # <- the KVM device request
              # nvidia.com/gpu: "1"    # <- uncomment with runtimeClassName: nvidia

          volumeMounts:
            - { mountPath: /dev/net/tun, name: devtun }
      volumes:
        - name: devtun
          hostPath: { path: /dev/net/tun, type: CharDevice }
---
# Worker Connect API (WorkerService + WorkerEnroll).
apiVersion: v1
kind: Service
metadata:
  name: easyworker-android
  namespace: temp
  labels:
    app: easyworker-android
spec:
  selector:
    app: easyworker-android
  ports:
    - { name: http, port: 80, targetPort: 48080 }
    - { name: worker, port: 48080, targetPort: 48080 }
  type: ClusterIP
---
# Browser screen (open, no auth — ClusterIP only).
apiVersion: v1
kind: Service
metadata:
  name: easyworker-android-novnc
  namespace: temp
  labels:
    app: easyworker-android
spec:
  selector:
    app: easyworker-android
  ports:
    - { name: screen, port: 80, targetPort: 6080 }
  type: ClusterIP
