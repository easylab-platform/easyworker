# easyworker Android (BlissOS) sandbox — KVM-accelerated Android 13 guest.
#
# Like the Windows/macOS VM workers this requests /dev/kvm via the device
# plugin (k8s/generic-device-plugin.yaml) and stays privileged: false. The
# difference: the easyworker binary runs on the HOST side (Android cannot run
# the linux/amd64 Go worker) and drives the guest over adb; ws-scrcpy serves
# the screen to a browser instead of noVNC.
#
# Endpoints (inside the pod):
#   :48080  Worker API   (WorkerService + WorkerEnroll)
#   :8000   ws-scrcpy    (open, no auth — ClusterIP only)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyworker-android
  namespace: temp
  labels:
    app: easyworker-android
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easyworker-android
  template:
    metadata:
      labels:
        app: easyworker-android
    spec:
      nodeSelector:
        kubernetes.io/hostname: <node-name>
      containers:
        - name: android
          image: <registry>/easyworker-android-blessos:v1.0.0
          imagePullPolicy: IfNotPresent

          # NOT privileged: KVM is delivered by the device plugin
          # (squat.ai/kvm), exactly like the Windows/macOS VM workers.
          securityContext:
            privileged: false
            runAsUser: 0
            allowPrivilegeEscalation: true
            seccompProfile: { type: Unconfined }
            appArmorProfile: { type: Unconfined }
            capabilities:
              add: ["NET_ADMIN","NET_RAW","SYS_ADMIN","SYS_NICE","MKNOD",
                    "CHOWN","SETUID","SETGID","DAC_OVERRIDE","FOWNER","KILL"]

          env:
            # Set a value to pre-authorize the worker (zero-touch, no claim);
            # leave empty for the default random-code enrollment flow.
            - { name: WORKER_TOKEN, value: "" }
            - { name: WORKER_PORT, value: "48080" }
            - { name: WORKER_WORKSPACE, value: "/workspace" }
            - { name: WORKER_DB, value: "/data/jobs.db" }
            - { name: ANDROID_MEM, value: "4096" }
            - { name: ANDROID_CPUS, value: "4" }

          ports:
            - { name: worker, containerPort: 48080 }
            - { name: ws-scrcpy, containerPort: 8000 }

          readinessProbe:
            httpGet: { path: /healthz, port: 48080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 48080 }
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests: { cpu: "4", memory: "6Gi" }
            limits: { cpu: "8", memory: "12Gi", squat.ai/kvm: "1" }

          volumeMounts:
            - { mountPath: /dev/net/tun, name: devtun }
            - { mountPath: /data, name: data }
      volumes:
        - name: devtun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        - name: data
          emptyDir: {}
---
# Worker Connect API (WorkerService + WorkerEnroll).
apiVersion: v1
kind: Service
metadata:
  name: easyworker-android
  namespace: temp
  labels:
    app: easyworker-android
spec:
  selector:
    app: easyworker-android
  ports:
    - { name: http, port: 80, targetPort: 48080 }
    - { name: worker, port: 48080, targetPort: 48080 }
  type: ClusterIP
---
# ws-scrcpy browser screen (open, no auth — ClusterIP only).
apiVersion: v1
kind: Service
metadata:
  name: easyworker-android-scrcpy
  namespace: temp
  labels:
    app: easyworker-android
spec:
  selector:
    app: easyworker-android
  ports:
    - { name: web, port: 8000, targetPort: 8000 }
  type: ClusterIP
