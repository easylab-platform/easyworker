# easyworker on a Linux desktop (labwc) — a GUI-program test sandbox.
#
# Unlike the Windows/macOS VM workers, this needs NO KVM and NO device plugin:
# the container runs the compositor directly (headless wlroots + wayvnc +
# noVNC) alongside the easyworker binary. No sidecar.
#
# Endpoints (inside the pod):
#   :48080  Worker API  (WorkerService + WorkerEnroll)
#   :5900   VNC         (wayvnc)
#   :6080   noVNC       (websockify, open — no auth by design)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyworker-linux-desktop
  namespace: temp
  labels:
    app: easyworker-linux-desktop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easyworker-linux-desktop
  template:
    metadata:
      labels:
        app: easyworker-linux-desktop
    spec:
      containers:
        - name: desktop
          image: <registry>/easyworker-linux-desktop:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            # Set a value to pre-authorize the worker (zero-touch, no claim);
            # leave empty for the default random-code enrollment flow.
            - { name: WORKER_TOKEN, value: "" }
            - { name: WORKER_PORT, value: "48080" }
            - { name: WORKER_WORKSPACE, value: "/workspace" }
            - { name: WORKER_DB, value: "/data/jobs.db" }
          ports:
            - { name: worker, containerPort: 48080 }
            - { name: vnc, containerPort: 5900 }
            - { name: novnc, containerPort: 6080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 48080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 48080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { mountPath: /data, name: data }
      volumes:
        - name: data
          emptyDir: {}
---
# Worker Connect API (WorkerService + WorkerEnroll).
apiVersion: v1
kind: Service
metadata:
  name: easyworker-linux-desktop
  namespace: temp
  labels:
    app: easyworker-linux-desktop
spec:
  selector:
    app: easyworker-linux-desktop
  ports:
    - { name: http, port: 80, targetPort: 48080 }
    - { name: worker, port: 48080, targetPort: 48080 }
  type: ClusterIP
---
# noVNC desktop view (open, no auth — ClusterIP only).
apiVersion: v1
kind: Service
metadata:
  name: easyworker-linux-desktop-novnc
  namespace: temp
  labels:
    app: easyworker-linux-desktop
spec:
  selector:
    app: easyworker-linux-desktop
  ports:
    - { name: novnc, port: 80, targetPort: 6080 }
  type: ClusterIP
