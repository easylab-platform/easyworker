# EasyWorker: expose the guest-only enrollment/token endpoint on port 8090.
# This listener is NOT published by any Kubernetes Service, and is further
# restricted to the guest subnet (172.30.0.0/24) + loopback, so the token never
# leaves the pod.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    # Only the QEMU guest network and the container itself may read it.
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    location = /token {
        alias /run/shm/token;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
